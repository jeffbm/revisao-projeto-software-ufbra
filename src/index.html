<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas de Estudo</title>
</head>

<body>

    <h1>Gerenciador de Tarefas de Estudo</h1>

    <p>
        Aplicação desenvolvida na disciplina Projeto de Software.
    </p>

    <hr>

    <h2>Nova tarefa</h2>

    <input
        type="text"
        id="tituloTarefa"
        placeholder="Digite uma tarefa"
    >

    <button id="botaoAdicionar">
        Adicionar tarefa
    </button>

    <h2>Tarefas cadastradas</h2>

    <ul id="listaTarefas">
        <!-- As tarefas serão inseridas aqui pelo JavaScript -->
    </ul>

    <script src="app.js"></script>

</body>
</html>
